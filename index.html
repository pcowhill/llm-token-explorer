<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore tokenization, next-token logits, probabilities and sampling with real LLM inference running entirely in your browser."
    />
    <meta name="theme-color" content="#1f2937" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>LLM Token Explorer</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('lte:theme') || '"system"')
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript
      >LLM Token Explorer needs JavaScript (and WebAssembly) to run models in your
      browser.</noscript
    >
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
